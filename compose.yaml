services:
  mongo:
    image: mongo:8
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval "try { rs.status() } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) }"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  central:
    build: ./central-server
    env_file: ./central-server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/carpschool_central?replicaSet=rs0
      PORT: 3101
      SIGNING_KEY_FILE: /run/signing/central-signing.pem
    volumes: ["${SIGNING_KEYS_DIR:-./keys}:/run/signing:ro"]
    ports: ["127.0.0.1:41871:3101"]
    networks: [database, public]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped
  school:
    build: ./school-server
    env_file: ./school-server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/carpschool_school_kjt?replicaSet=rs0
      PORT: 5000
      SIGNING_KEY_PATH: /run/signing/school-signing.pem
    volumes: ["${SIGNING_KEYS_DIR:-./keys}:/run/signing:ro"]
    ports: ["127.0.0.1:41872:5000"]
    networks: [database, public]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped
networks:
  database:
    internal: true
  public: {}
volumes:
  mongo-data: {}
