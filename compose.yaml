services:
  mongo:
    image: mongo:8
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [./data/mongo:/data/db]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval "try { rs.status() } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) }"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  central:
    build: ./central-server
    env_file: ./central-server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/carpschool_central?replicaSet=rs0
      PORT: 3101
      SIGNING_KEY_FILE: /run/signing/central-signing.pem
    volumes: ["./data/central:/app/data"]
    networks: [database, public, carpschool_bridge]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped
  school:
    build: ./school-server
    env_file: ./school-server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/carpschool_school_sss?replicaSet=rs0
      PORT: 5000
      SIGNING_KEY_PATH: /run/signing/school-signing.pem
    volumes: ["./data/school:/app/data"]
    networks: [database, public, carpschool_bridge]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CENTRAL_SERVER_URL: https://api.carpschool.ca
    env_file: ./web/.env
    environment:
      TILESERVER_URL: http://tiles:8080
    networks: [public, tiles, carpschool_bridge]
    depends_on: [tiles]
    restart: unless-stopped
  # Self-hosted OpenMapTiles vector tiles. No published port: only the web app reaches it (proxied at /tiles).
  tiles:
    image: maptiler/tileserver-gl:latest
    command: [--config, /data/config.json, --port, "8080"]
    volumes: ["${TILES_DIR:-./tiles}:/data:ro"]
    networks: [tiles]
    restart: unless-stopped
networks:
  carpschool_bridge: {external: true}
  tiles:
    internal: true
  database:
    internal: true
  public: {}
